# Records the Listen narration in ElevenLabs' Jessica voice and saves it to the guide.
# Lives at .github/workflows/record-narration.yml in the repository.
name: Record Jessica narration

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder that contains the guide's index.html"
        required: true
        default: "lease-explainer-github-ready_7"
      only:
        description: "Test one term only (e.g. rent). Leave blank to record every term."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: record-narration
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record clips
        working-directory: ${{ inputs.folder }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::The ELEVENLABS_API_KEY secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -n "$ONLY" ]; then
            node tools/generate-narration.mjs --only="$ONLY"
          else
            node tools/generate-narration.mjs
          fi

      - name: Save recordings to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.folder }}/assets/audio"
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Record Jessica narration${{ inputs.only && format(' ({0})', inputs.only) || '' }}"
            git push
          fi
